{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFridge</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="logo">🧊 <span>SmartFridge</span></div>
        <nav>
            <a href="{% url 'inventory' %}" class="nav-link">My Fridge</a>
            <a href="{% url 'recipes' %}" class="nav-link">What Can I Cook?</a>
            <a href="/admin/" class="nav-link admin-link">Admin</a>
            <button id="theme-toggle" class="btn-theme" title="Toggle Dark Mode">🌙</button>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
